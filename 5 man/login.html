<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5man's Rice Trading | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body>
    <section class="login-page">
        <div class="login-box">

            <!-- ===== LOGIN FORM (shown first) ===== -->
            <form id="login-form">
                <img src="images/logo.png" alt="logo" style="mix-blend-mode: normal; margin: auto; padding: 10px;margin-bottom: 10px;" width="150px">
                <h1>Welcome Back!</h1>
                <p class="login-subtitle">Please log in to your account</p>

                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>

                <button type="submit" class="btn">Login</button>
                <p class="form-message" id="login-note"></p>
                <p class="switch-text">No account yet? <a href="#" id="show-signup">Sign Up</a></p>
            </form>

            <!-- ===== SIGN UP FORM (hidden until "Sign Up" is clicked) ===== -->
            <form id="signup-form" class="hidden">
                <img src="images/logo.png" alt="logo" style="mix-blend-mode: normal; margin: auto; padding: 10px;margin-bottom: 10px;" width="150px">
                <h1>Create Account</h1>
                <p class="login-subtitle">Sign up to get started</p>

                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required>
                </div>
                <div class="form-group">
                    <label for="signup-repeat">Repeat Password</label>
                    <input type="password" id="signup-repeat" required>
                </div>

                <button type="submit" class="btn">Sign Up</button>
                <p class="form-message" id="signup-note"></p>
                <p class="switch-text">Already have an account? <a href="#" id="show-login">Login</a></p>
            </form>

        </div>
    </section>


    <script src="script.js"></script>
</body>
</html>
